# Static server for the built SPA.
# TLS, HTTP/2 and the security headers are handled by the Apache reverse proxy
# in front of this container (see apache.conf) and are not duplicated here.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the exact version on a public-facing service
    server_tokens off;

    # Text assets are served pre-compressed by nothing upstream, so compress here
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Container-level probe used by HEALTHCHECK and by the deploy workflow
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames in /assets: safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Workbox runtime is emitted at the root with a content hash in its name
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA control files must always be revalidated, otherwise clients stay
    # pinned to a stale service worker after a deployment.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths are resolved by vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
