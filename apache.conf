# ! This Apache2 file is NOT AUTOMATICALLY GENERATED or PUSHED IN PRODUCTION AUTOMATICALLY  
# ! It is just a reference that NEEDS TO FIT THE EXACT SERVER CONFIGURATION to ensure reproductibility

<VirtualHost *:80>
    ServerName undercover.dev-it.app
    Redirect permanent / https://undercover.dev-it.app/
</VirtualHost>

<VirtualHost *:443>
    ServerName undercover.dev-it.app

    Protocols h2 h2c http/1.1
    ProtocolsHonorOrder On

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/undercover.dev-it.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/undercover.dev-it.app/privkey.pem

    DocumentRoot /var/www/html/undercover

    <Directory /var/www/html/undercover>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted 

        # Rewrite rule for Vue.js history mode
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/undercover_error.log
    CustomLog ${APACHE_LOG_DIR}/undercover_access.log combined
</VirtualHost>
